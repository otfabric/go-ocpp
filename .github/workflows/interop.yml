name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Runs go-ocpp against the reference implementations published by
# otfabric/ocpp-interop: its client against each reference CSMS, and each
# reference station against its server. The images are consumed as
# published: nothing of ocpp-interop is cloned or built here.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      mobilityhouse_image:
        description: "Mobility House reference image (default: the pinned release)"
        required: false
      chargetime_image:
        description: "ChargeTimeEU reference image (default: the pinned release)"
        required: false
      lorenzodonini_image:
        description: "lorenzodonini/ocpp-go reference image (default: the pinned release)"
        required: false
      everest_image:
        description: "EVerest libocpp reference image (default: the pinned release)"
        required: false
      citrineos_image:
        description: "CitrineOS reference image (default: the pinned release)"
        required: false

permissions:
  contents: read
  packages: read

env:
  # otfabric/ocpp-interop v0.6.2: The Mobility House ocpp 2.1.0,
  # ChargeTimeEU Java-OCA-OCPP v2.0, lorenzodonini/ocpp-go v0.19.0, EVerest
  # libocpp of everest-core 2026.02.2, CitrineOS core v2.1.0.
  # Keep in step with the Makefile and interop/harness.go.
  OCPP_INTEROP_MOBILITYHOUSE_IMAGE: ${{ inputs.mobilityhouse_image || 'ghcr.io/otfabric/ocpp-interop-mobilityhouse@sha256:6acab461ad5712d1c6b1f8756d07546aaa76e2c675d16519b94f22e0434a0109' }}
  OCPP_INTEROP_CHARGETIME_IMAGE: ${{ inputs.chargetime_image || 'ghcr.io/otfabric/ocpp-interop-chargetime@sha256:d1795086026c1f0eae8d202352a6e24833b001a151e3ae535a085ef713d397da' }}
  OCPP_INTEROP_LORENZODONINI_IMAGE: ${{ inputs.lorenzodonini_image || 'ghcr.io/otfabric/ocpp-interop-lorenzodonini@sha256:9b6f07817a21df483310eb753ad2639a80153c874f997ce1c685c4c0430f57f6' }}
  OCPP_INTEROP_EVEREST_IMAGE: ${{ inputs.everest_image || 'ghcr.io/otfabric/ocpp-interop-everest@sha256:2113ee3aaea24d43064c3734ff0669fe345de17ebfd537f4e26dcd147294fc52' }}
  OCPP_INTEROP_CITRINEOS_IMAGE: ${{ inputs.citrineos_image || 'ghcr.io/otfabric/ocpp-interop-citrineos@sha256:7484082686b956e3ddff86a98171d20208887773618e6061fd22f6efc5afc0d2' }}

jobs:
  interop:
    name: Mobility House + ChargeTimeEU + ocpp-go + EVerest + CitrineOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Pull reference images
        run: |
          images=("${OCPP_INTEROP_MOBILITYHOUSE_IMAGE}" "${OCPP_INTEROP_CHARGETIME_IMAGE}" "${OCPP_INTEROP_LORENZODONINI_IMAGE}" "${OCPP_INTEROP_EVEREST_IMAGE}" "${OCPP_INTEROP_CITRINEOS_IMAGE}")
          # GHCR is occasionally slow or rate limiting: try each pull a few times.
          for image in "${images[@]}"; do
            for attempt in 1 2 3 4 5; do
              docker pull "${image}" && break
              [[ "${attempt}" == 5 ]] && { echo "::error::cannot pull ${image}"; exit 1; }
              sleep $((attempt * 15))
            done
          done
          {
            echo "| Reference | Image | Upstream |"
            echo "|---|---|---|"
            for image in "${images[@]}"; do
              docker run --rm "${image}" print-capabilities \
                | jq -r --arg image "${image}" '"| \(.adapter) \(.adapterVersion) | `\($image)` | \(.upstream.name) \(.upstream.version) |"'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the interop suite
        run: make interop

      - name: Collect container logs on failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-ps.txt || true
          for c in $(docker ps -aq); do
            docker logs "$c" > "artifacts/${c}.log" 2>&1 || true
          done

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: interop-logs-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: ignore
