name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Runs go-ocpp against the reference implementations published by
# otfabric/ocpp-interop: its client against each reference CSMS, and each
# reference station against its server. The images are consumed as
# published: nothing of ocpp-interop is cloned or built here.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      mobilityhouse_image:
        description: "Mobility House reference image (default: the pinned release)"
        required: false
      chargetime_image:
        description: "ChargeTimeEU reference image (default: the pinned release)"
        required: false
      lorenzodonini_image:
        description: "lorenzodonini/ocpp-go reference image (default: the pinned release)"
        required: false
      everest_image:
        description: "EVerest libocpp reference image (default: the pinned release)"
        required: false
      citrineos_image:
        description: "CitrineOS reference image (default: the pinned release)"
        required: false

permissions:
  contents: read
  packages: read

env:
  # otfabric/ocpp-interop v0.5.3: The Mobility House ocpp 2.1.0,
  # ChargeTimeEU Java-OCA-OCPP v2.0, lorenzodonini/ocpp-go v0.19.0, EVerest
  # libocpp of everest-core 2026.02.1, CitrineOS core v2.0.1.
  # Keep in step with the Makefile and interop/harness.go.
  OCPP_INTEROP_MOBILITYHOUSE_IMAGE: ${{ inputs.mobilityhouse_image || 'ghcr.io/otfabric/ocpp-interop-mobilityhouse@sha256:14d8da52ba062873fdc55834585dcd97b2405557004a3c438f04ee60e1bff1b5' }}
  OCPP_INTEROP_CHARGETIME_IMAGE: ${{ inputs.chargetime_image || 'ghcr.io/otfabric/ocpp-interop-chargetime@sha256:45c8706c8556d66f356289b72c7f6462a8c2eeb4ca280f7e990fd877f195f868' }}
  OCPP_INTEROP_LORENZODONINI_IMAGE: ${{ inputs.lorenzodonini_image || 'ghcr.io/otfabric/ocpp-interop-lorenzodonini@sha256:4409b30613fb081e0b6378d6bb87faa78a4986c82f0006618e33ace9730c4ae6' }}
  OCPP_INTEROP_EVEREST_IMAGE: ${{ inputs.everest_image || 'ghcr.io/otfabric/ocpp-interop-everest@sha256:3ed9f3acf531dc1681c6b372a0b23cc69c8806568729f92973eb80820becab72' }}
  OCPP_INTEROP_CITRINEOS_IMAGE: ${{ inputs.citrineos_image || 'ghcr.io/otfabric/ocpp-interop-citrineos@sha256:4d0c4b5d4192ed5d85260a30000fdea2e77a3b33e97db184c9473a4971d2c93f' }}

jobs:
  interop:
    name: Mobility House + ChargeTimeEU + ocpp-go + EVerest + CitrineOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Pull reference images
        run: |
          images=("${OCPP_INTEROP_MOBILITYHOUSE_IMAGE}" "${OCPP_INTEROP_CHARGETIME_IMAGE}" "${OCPP_INTEROP_LORENZODONINI_IMAGE}" "${OCPP_INTEROP_EVEREST_IMAGE}" "${OCPP_INTEROP_CITRINEOS_IMAGE}")
          # GHCR is occasionally slow or rate limiting: try each pull a few times.
          for image in "${images[@]}"; do
            for attempt in 1 2 3 4 5; do
              docker pull "${image}" && break
              [[ "${attempt}" == 5 ]] && { echo "::error::cannot pull ${image}"; exit 1; }
              sleep $((attempt * 15))
            done
          done
          {
            echo "| Reference | Image | Upstream |"
            echo "|---|---|---|"
            for image in "${images[@]}"; do
              docker run --rm "${image}" print-capabilities \
                | jq -r --arg image "${image}" '"| \(.adapter) \(.adapterVersion) | `\($image)` | \(.upstream.name) \(.upstream.version) |"'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the interop suite
        run: make interop

      - name: Collect container logs on failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-ps.txt || true
          for c in $(docker ps -aq); do
            docker logs "$c" > "artifacts/${c}.log" 2>&1 || true
          done

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: interop-logs-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: ignore
