name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Runs go-ocpp against the reference implementations published by
# otfabric/ocpp-interop: its client against each reference CSMS, and each
# reference station against its server. The images are consumed as
# published: nothing of ocpp-interop is cloned or built here.

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: ["**"]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
    inputs:
      mobilityhouse_image:
        description: "Mobility House reference image (default: the pinned release)"
        required: false
      chargetime_image:
        description: "ChargeTimeEU reference image (default: the pinned release)"
        required: false
      lorenzodonini_image:
        description: "lorenzodonini/ocpp-go reference image (default: the pinned release)"
        required: false
      everest_image:
        description: "EVerest libocpp reference image (default: the pinned release)"
        required: false
      citrineos_image:
        description: "CitrineOS reference image (default: the pinned release)"
        required: false
      cbsigma_image:
        description: "cB-Sigma/ocpp reference image (default: the pinned release)"
        required: false
      ocppkit_image:
        description: "hupe1980/ocpp-kit reference image (default: the pinned release)"
        required: false
      seanlee_image:
        description: "seanlee0923/ocpp reference image (default: the pinned release)"
        required: false

permissions:
  contents: read
  packages: read

env:
  # otfabric/ocpp-interop v0.10.0: The Mobility House ocpp 2.1.0,
  # ChargeTimeEU Java-OCA-OCPP v2.0, lorenzodonini/ocpp-go v0.19.0, EVerest
  # libocpp of everest-core 2026.02.2, CitrineOS core v2.1.0, cB-Sigma/ocpp v0.2.0,
  # hupe1980/ocpp-kit 0.3.0, seanlee0923/ocpp v0.3.0.
  # Pinned by multi-arch index digest; keep in step with interop/harness.go and the Makefile.
  OCPP_INTEROP_MOBILITYHOUSE_IMAGE: ${{ inputs.mobilityhouse_image || 'ghcr.io/otfabric/ocpp-interop-mobilityhouse@sha256:347b228ffa4b88f6bad36c8c170e3f13b95489f29455a2c28ca8c1e760b26b97' }}
  OCPP_INTEROP_CHARGETIME_IMAGE: ${{ inputs.chargetime_image || 'ghcr.io/otfabric/ocpp-interop-chargetime@sha256:a455edea1b1f6b7cabcbe60dce7caead9d44aef63ef4f1c7c1b73077cf3d10e9' }}
  OCPP_INTEROP_LORENZODONINI_IMAGE: ${{ inputs.lorenzodonini_image || 'ghcr.io/otfabric/ocpp-interop-lorenzodonini@sha256:902cea48e055575420eb3537f4ad823adb067664896158f8d5d6f71a23b62afc' }}
  OCPP_INTEROP_EVEREST_IMAGE: ${{ inputs.everest_image || 'ghcr.io/otfabric/ocpp-interop-everest@sha256:e56ec2d4033e7ede137c8801861ec7f3c84eb7f83f8ccb5e3cc29324005b9f7c' }}
  OCPP_INTEROP_CITRINEOS_IMAGE: ${{ inputs.citrineos_image || 'ghcr.io/otfabric/ocpp-interop-citrineos@sha256:c0da2ffe666b0f1926d44ff35fc06036503e4f76d6b817d319a0c97dd7dd32e5' }}
  OCPP_INTEROP_CBSIGMA_IMAGE: ${{ inputs.cbsigma_image || 'ghcr.io/otfabric/ocpp-interop-cbsigma@sha256:57b20270aec341de671cfda609b22e46b71914870b22b12357aada321fc45297' }}
  OCPP_INTEROP_OCPPKIT_IMAGE: ${{ inputs.ocppkit_image || 'ghcr.io/otfabric/ocpp-interop-ocppkit@sha256:1c51e474386fdfc7a47c00edbc91243f4cc6ef0a9d0c4d9ebb3b0f8dc99f5ef7' }}
  OCPP_INTEROP_SEANLEE_IMAGE: ${{ inputs.seanlee_image || 'ghcr.io/otfabric/ocpp-interop-seanlee@sha256:bab883c4f4f43592c0d78f2b7ab1a2195c8d16a23aacb9afa4fe3b4f388d7e3a' }}

jobs:
  interop:
    name: Mobility House + ChargeTimeEU + ocpp-go + EVerest + CitrineOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Pull reference images
        run: |
          images=("${OCPP_INTEROP_MOBILITYHOUSE_IMAGE}" "${OCPP_INTEROP_CHARGETIME_IMAGE}" "${OCPP_INTEROP_LORENZODONINI_IMAGE}" "${OCPP_INTEROP_EVEREST_IMAGE}" "${OCPP_INTEROP_CITRINEOS_IMAGE}" "${OCPP_INTEROP_CBSIGMA_IMAGE}" "${OCPP_INTEROP_OCPPKIT_IMAGE}" "${OCPP_INTEROP_SEANLEE_IMAGE}")
          # GHCR is occasionally slow or rate limiting: try each pull a few times.
          for image in "${images[@]}"; do
            for attempt in 1 2 3 4 5; do
              docker pull "${image}" && break
              [[ "${attempt}" == 5 ]] && { echo "::error::cannot pull ${image}"; exit 1; }
              sleep $((attempt * 15))
            done
          done
          {
            echo "| Reference | Image | Upstream |"
            echo "|---|---|---|"
            for image in "${images[@]}"; do
              docker run --rm "${image}" print-capabilities \
                | jq -r --arg image "${image}" '"| \(.adapter) \(.adapterVersion) | `\($image)` | \(.upstream.name) \(.upstream.version) |"'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the interop suite
        run: make interop

      - name: Collect container logs on failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-ps.txt || true
          for c in $(docker ps -aq); do
            docker logs "$c" > "artifacts/${c}.log" 2>&1 || true
          done

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: interop-logs-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: ignore
