name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Runs go-ocpp against the reference implementations published by
# otfabric/ocpp-interop: its client against each reference CSMS, and each
# reference station against its server. The images are consumed as
# published: nothing of ocpp-interop is cloned or built here.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      mobilityhouse_image:
        description: "Mobility House reference image (default: the pinned release)"
        required: false
      chargetime_image:
        description: "ChargeTimeEU reference image (default: the pinned release)"
        required: false
      lorenzodonini_image:
        description: "lorenzodonini/ocpp-go reference image (default: the pinned release)"
        required: false
      everest_image:
        description: "EVerest libocpp reference image (default: the pinned release)"
        required: false
      citrineos_image:
        description: "CitrineOS reference image (default: the pinned release)"
        required: false

permissions:
  contents: read
  packages: read

env:
  # otfabric/ocpp-interop v0.4.1: The Mobility House ocpp 2.1.0,
  # ChargeTimeEU Java-OCA-OCPP v2.0, lorenzodonini/ocpp-go v0.19.0, EVerest
  # libocpp of everest-core 2026.02.1, CitrineOS core v2.0.1.
  # Keep in step with the Makefile and interop/harness.go.
  OCPP_INTEROP_MOBILITYHOUSE_IMAGE: ${{ inputs.mobilityhouse_image || 'ghcr.io/otfabric/ocpp-interop-mobilityhouse@sha256:3f14958e9f21d85d3e18542bcbc9460bc8b7163a2982f4539dc7b8f78eb70fca' }}
  OCPP_INTEROP_CHARGETIME_IMAGE: ${{ inputs.chargetime_image || 'ghcr.io/otfabric/ocpp-interop-chargetime@sha256:221f0cec9ae24c5ed3fcd1e7b9b1efa95ab4fb1b1c1e698ec8fcc5096af43242' }}
  OCPP_INTEROP_LORENZODONINI_IMAGE: ${{ inputs.lorenzodonini_image || 'ghcr.io/otfabric/ocpp-interop-lorenzodonini@sha256:e6cc15c217be02edd4f4a2dddefae247a0deb3ce6384c5843b9fbf7fc4c1cca4' }}
  OCPP_INTEROP_EVEREST_IMAGE: ${{ inputs.everest_image || 'ghcr.io/otfabric/ocpp-interop-everest@sha256:abd99af84484ceddf6607caa402d6ca2b3aa25f5f3aa774de5d3016e14dfb99d' }}
  OCPP_INTEROP_CITRINEOS_IMAGE: ${{ inputs.citrineos_image || 'ghcr.io/otfabric/ocpp-interop-citrineos@sha256:143878b708c4f2638ee3a2aaaa9df8f061a9f0a717bdf01a02a4fcb69769b898' }}

jobs:
  interop:
    name: Mobility House + ChargeTimeEU + ocpp-go + EVerest + CitrineOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Pull reference images
        run: |
          images=("${OCPP_INTEROP_MOBILITYHOUSE_IMAGE}" "${OCPP_INTEROP_CHARGETIME_IMAGE}" "${OCPP_INTEROP_LORENZODONINI_IMAGE}" "${OCPP_INTEROP_EVEREST_IMAGE}" "${OCPP_INTEROP_CITRINEOS_IMAGE}")
          # GHCR is occasionally slow or rate limiting: try each pull a few times.
          for image in "${images[@]}"; do
            for attempt in 1 2 3 4 5; do
              docker pull "${image}" && break
              [[ "${attempt}" == 5 ]] && { echo "::error::cannot pull ${image}"; exit 1; }
              sleep $((attempt * 15))
            done
          done
          {
            echo "| Reference | Image | Upstream |"
            echo "|---|---|---|"
            for image in "${images[@]}"; do
              docker run --rm "${image}" print-capabilities \
                | jq -r --arg image "${image}" '"| \(.adapter) \(.adapterVersion) | `\($image)` | \(.upstream.name) \(.upstream.version) |"'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the interop suite
        run: make interop

      - name: Collect container logs on failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-ps.txt || true
          for c in $(docker ps -aq); do
            docker logs "$c" > "artifacts/${c}.log" 2>&1 || true
          done

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: interop-logs-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: ignore
